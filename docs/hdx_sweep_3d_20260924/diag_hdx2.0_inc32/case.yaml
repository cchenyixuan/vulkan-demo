schema_version: 2

# 3D lid-driven cavity — 1.03M-particle case.
# GENERATED by utils/geometry/_demo_cavity_case_3d.py:
#   frame    = bounding box of the 1 m^3 cavity + border shell
#   domain   = 1,030,301 fluid particles (simple-cubic lattice)
#   wall     = 223,924 static shell particles (4 layers, 5 faces + edges)
#   wall_top = 40,804 lid particles (band above the fluid footprint);
#              stick_lid has initial_velocity=[1,0,0]
# h = 0.020000, dx = 0.010000 -> h/dx = 2.0 (3D cost knob; 2D cases use 5).
# max_per_voxel 64 >= ceil(sqrt(2)*(h/dx)^3) = 12
# (V5 loader does not self-check; undersized cap = SILENT particle kills).
# derived: expected neighbors (4/3)pi(h/dx)^3 = 33.5; particles per voxel (h/dx)^3 = 8.0; dt = cfl*h/c0 = 3.000000e-05 s; total particles = 1,295,029
# max_per_voxel = ceil(1.3 * bound) rounded up to 32 (min 32); max_incoming = max_per_voxel/4 (min 8); eps_h^2 = 0.01 h^2, delta and PST coefficients unchanged (dimensionless).
time:
  total: null
  max_steps: null
  output_cadence: null

physics:
  dimension: 3
  h: 0.020000
  particle_radius: 0.005000
  lattice: grid
  calibrate_volume: true
  speed_of_sound: 100.0
  power: 7
  cfl: 0.15
  gravity: [0.0, 0.0, 0.0]

numerics:
  use_density_diffusion: true
  delta_coefficient: 0.1
  use_kcg_correction: true
  regularization:
    xi: 0.1
    det_threshold: 1.0e-4
    frobenius_max: 10.0
  use_pst: true
  pst_main: 0.1
  pst_anti: 0.0005
  defrag_enabled: true
  defrag_cadence: 1000
  use_prefix_sum_defrag: false

capacities:
  pool_size: 1489408
  max_per_voxel: 64
  max_incoming: 32
  workgroup: 128

material_library: ../../../materials/standard.yaml

geometry:
  frame: frame.obj
  particles:
    - {file: domain.obj,   material: stick_water}
    - {file: wall.obj,     material: stick_wall}
    - {file: wall_top.obj, material: stick_lid}
