schema_version: 2

# GENERATED by experiment/validation/micropolar_channel.py cases: poiseuille_m2_l20_control_repeat
# Steady plane Poiseuille flow: walls at rest, a uniform body force along x.
# Channel periodic in x: [0, 0.100000) x [0, 0.080000) m, 100 x 80 = 8,000 fluid particles on the
# cell centres, dx = 0.001 m, h = 5 dx; walls of 11 layers below y = 0 and above y = H (adami, w = 0),
# 2,200 particles. Control: nu = nu_inf = 0.008 m^2/s on the micropolar path, nu_t = -nu (c = 0), xi = 0, Theta = 0.0004 (passive w).
# Speed of sound 50 m/s (Ma = 0.02 on the Newtonian centreline speed). dt = 1.500000e-05 s (acoustic limit;
# acoustic 1.500e-05, viscous 6.406e-05, angular diffusion 6.958e-05); end 1.2 s =
# 80,000 steps.

time:
  total: null
  max_steps: null
  output_cadence: null

physics:
  dimension: 2
  periodic: [true, false]
  h: 5.0000000000e-03
  particle_radius: 5.0000000000e-04
  lattice: grid
  calibrate_volume: true
  speed_of_sound: 50.0
  power: 7
  cfl: 0.1500000000
  gravity: [10.0, 0.0, 0.0]
  micropolar:
    enabled: true
    micro_inertia: 0.0004

numerics:
  use_density_diffusion: true
  delta_coefficient: 0.1
  use_kcg_correction: true
  regularization:
    xi: 0.001
    det_threshold: 1.0e-4
    frobenius_max: 10.0
  epsilon_squared_factor: 1.0e-6
  use_pst: true
  pst_main: 0.1
  pst_anti: 0.0005
  defrag_enabled: true
  defrag_cadence: 1000
  use_prefix_sum_defrag: false
  viscous_form: laplacian
  wall_boundary: adami

capacities:
  pool_size: 12288
  max_per_voxel: 64
  max_incoming: 16
  workgroup: 128

material_library: materials.yaml

geometry:
  frame: ../geometry_h80/frame.obj
  particles:
    - {file: ../geometry_h80/domain.obj, material: channel_fluid}
    - {file: ../geometry_h80/lower.obj,  material: channel_wall}
    - {file: ../geometry_h80/upper.obj,  material: channel_wall}
