schema_version: 2

# GENERATED by experiment/validation/micropolar_channel.py cases: couette_m10_l10_control
# Steady plane Couette flow: the lower wall slides at U = 1 m/s, the upper wall at rest.
# Channel periodic in x: [0, 0.100000) x [0, 0.200000) m, 100 x 200 = 20,000 fluid particles on the
# cell centres, dx = 0.001 m, h = 5 dx; walls of 11 layers below y = 0 and above y = H (adami, w = 0),
# 2,200 particles. Control: nu = nu_inf = 0.02 m^2/s on the micropolar path, nu_t = -nu (c = 0), xi = 0, Theta = 0.0001 (passive w).
# Speed of sound 50 m/s (Ma = 0.02 on U). dt = 1.500000e-05 s (acoustic limit;
# acoustic 1.500e-05, viscous 2.563e-05, angular diffusion 2.783e-05); end 3 s =
# 200,000 steps.

time:
  total: null
  max_steps: null
  output_cadence: null

physics:
  dimension: 2
  periodic: [true, false]
  h: 5.0000000000e-03
  particle_radius: 5.0000000000e-04
  lattice: grid
  calibrate_volume: true
  speed_of_sound: 50.0
  power: 7
  cfl: 0.1500000000
  gravity: [0.0, 0.0, 0.0]
  micropolar:
    enabled: true
    micro_inertia: 0.0001

numerics:
  use_density_diffusion: true
  delta_coefficient: 0.1
  use_kcg_correction: true
  regularization:
    xi: 0.001
    det_threshold: 1.0e-4
    frobenius_max: 10.0
  epsilon_squared_factor: 1.0e-6
  use_pst: true
  pst_main: 0.1
  pst_anti: 0.0005
  defrag_enabled: true
  defrag_cadence: 1000
  use_prefix_sum_defrag: false
  viscous_form: laplacian
  wall_boundary: adami

capacities:
  pool_size: 26752
  max_per_voxel: 64
  max_incoming: 16
  workgroup: 128

material_library: materials.yaml

geometry:
  frame: ../geometry_h200/frame.obj
  particles:
    - {file: ../geometry_h200/domain.obj, material: channel_fluid}
    - {file: ../geometry_h200/lower.obj,  material: channel_sliding_wall}
    - {file: ../geometry_h200/upper.obj,  material: channel_wall}
