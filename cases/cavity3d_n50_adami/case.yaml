# VARIANT of cases/cavity3d_n50 (report section 25, 2026-11-20): numerics.wall_boundary adami; everything else identical; the particle OBJs are cavity3d_n50's (referenced, not copied).
schema_version: 2

# 3D lid-driven cavity — 0.13M-particle case.
# GENERATED by utils/geometry/_demo_cavity_case_3d.py:
#   frame    = bounding box of the 1 m^3 cavity + border shell
#   domain   = 132,651 fluid particles (simple-cubic lattice)
#   wall     = 172,449 static shell particles (9 layers, 5 faces + edges)
#   wall_top = 23,409 lid particles (band above the fluid footprint);
#              stick_lid has initial_velocity=[1,0,0]
# h = 0.080000, dx = 0.020000 -> h/dx = 4.0 (3D cost knob; 2D cases use 5).
# max_per_voxel 128 >= ceil(sqrt(2)*(h/dx)^3) = 91
# (V5 loader does not self-check; undersized cap = SILENT particle kills).
# derived: expected neighbors (4/3)pi(h/dx)^3 = 268.1; particles per voxel (h/dx)^3 = 64.0; dt = cfl*h/c0 = 1.200000e-04 s; total particles = 328,509
# max_per_voxel = ceil(1.3 * bound) rounded up to 32 (min 32); max_incoming = max_per_voxel/4 (min 8); eps_h^2 = 0.01 h^2, delta and PST coefficients unchanged (dimensionless).
time:
  total: null
  max_steps: null
  output_cadence: null

physics:
  dimension: 3
  h: 0.080000
  particle_radius: 0.010000
  lattice: grid
  calibrate_volume: true
  speed_of_sound: 100.0
  power: 7
  cfl: 0.15
  gravity: [0.0, 0.0, 0.0]

numerics:
  use_density_diffusion: true
  delta_coefficient: 0.1
  use_kcg_correction: true
  regularization:
    xi: 0.001
    det_threshold: 1.0e-4
    frobenius_max: 10.0
  # eps^2 = epsilon_squared_factor * h^2 (h = support radius) in the viscous / delta-diffusion
  # denominators; read by the V0 and v6 loaders (v2-v5 ignore it and use 0.01)
  epsilon_squared_factor: 0.0025
  use_pst: true
  pst_main: 0.1
  pst_anti: 0.0005
  defrag_enabled: true
  defrag_cadence: 1000
  defrag_order: prefix              # defrag pid order: prefix (voxel-id order, default since 2026-10-27) | atomic (arrival order)
  wall_boundary: adami   # Adami 2012 wall pressure + no-slip, walls store rho0

capacities:
  pool_size: 377856
  max_per_voxel: 128
  max_incoming: 32
  workgroup: 128

material_library: ../../materials/standard.yaml

geometry:
  frame: ../cavity3d_n50/frame.obj
  particles:
    - {file: ../cavity3d_n50/domain.obj,   material: stick_water}
    - {file: ../cavity3d_n50/wall.obj,     material: stick_wall}
    - {file: ../cavity3d_n50/wall_top.obj, material: stick_lid}
