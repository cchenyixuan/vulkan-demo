schema_version: 2

# Re = 3200, 2000^2 VARIANT (2026-10-20 night, user: the refinement branch if the 1000^2 Re = 3200 run misses 1 % vs Marchi):
# the particles of cases/lid_driven_cavity_2d_n2000 (generated 2026-10-20 by utils/geometry/_demo_cavity_case.py --half 1000:
# 4,004,001 fluid + 66,517 wall + 22,011 lid = 4,092,529, h = 0.0025 = 5 dx, 11 layers, referenced not copied), adami walls,
# xi 0.001, eps^2 0.0025 h^2, U = 1, the *_re3200 materials of the case-local materials_re3200.yaml (nu = 3.125e-4).
# dt = 3.75e-6 (CFL on c = 100). Started warm from the 1000^2 run's final field (cavity_runner --initial-velocity).

time:
  total: null
  max_steps: null
  output_cadence: null

physics:
  dimension: 2
  h: 0.002500
  particle_radius: 0.000250
  lattice: grid
  calibrate_volume: true
  speed_of_sound: 100.0
  power: 7
  cfl: 0.15
  gravity: [0.0, 0.0, 0.0]

numerics:
  use_density_diffusion: true
  delta_coefficient: 0.1
  use_kcg_correction: true
  regularization:
    xi: 0.001
    det_threshold: 1.0e-4
    frobenius_max: 10.0
  # eps^2 = epsilon_squared_factor * h^2 (h = support radius) in the viscous / delta-diffusion
  # denominators; read by the V0 and v6 loaders (v2-v5 ignore it and use 0.01)
  epsilon_squared_factor: 0.0025
  use_pst: true
  pst_main: 0.1
  pst_anti: 0.0005
  defrag_enabled: true
  defrag_cadence: 1000
  use_prefix_sum_defrag: false
  wall_boundary: adami   # E37: Adami 2012 wall pressure + no-slip, walls store rho0

capacities:
  pool_size: 4706432
  max_per_voxel: 96
  max_incoming: 16
  workgroup: 128

material_library: materials_re3200.yaml

geometry:
  frame: ../lid_driven_cavity_2d_n2000/frame.obj
  particles:
    - {file: ../lid_driven_cavity_2d_n2000/domain.obj,   material: stick_water_re3200}
    - {file: ../lid_driven_cavity_2d_n2000/wall.obj,     material: stick_wall_re3200}
    - {file: ../lid_driven_cavity_2d_n2000/wall_top.obj, material: stick_lid_re3200}
