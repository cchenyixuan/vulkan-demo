# Case-local material library of the Re = 5000 cavity (2026-11-02): the *_re3200 materials of the Re = 3200 case with
# nu = 2.0e-4 = 1 / 5000 for U = L = 1.

stick_water_re5000:
  kind: fluid
  rest_density: 1000.0
  viscosity: 2.0e-4

stick_wall_re5000:
  kind: boundary
  rest_density: 1000.0
  viscosity: 2.0e-4

stick_lid_re5000:
  kind: boundary
  rest_density: 1000.0
  viscosity: 2.0e-4
  initial_velocity: [1.0, 0.0, 0.0]
