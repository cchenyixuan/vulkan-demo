# cavity3d_re1000_n100_hdx4_crossing (claude/wall_store_report.md section 14, experiment/wall_crossing/cavity3d_re1000_cases.py): N = 100, h/dx = 4, crossing walls, Re = 1000 on L = 1 + dx (materials.yaml of ../cavity3d_re1000_n100); the particles are ../cavity3d_re1000_n100's.
schema_version: 2

# 3D lid-driven cavity — 1.03M-particle case.
# GENERATED by utils/geometry/_demo_cavity_case_3d.py:
#   frame    = bounding box of the 1 m^3 cavity + border shell
#   domain   = 1,030,301 fluid particles (simple-cubic lattice)
#   wall     = 563,049 static shell particles (9 layers, 5 faces + edges)
#   wall_top = 91,809 lid particles (band above the fluid footprint);
#              stick_lid has initial_velocity=[1,0,0]
# h = 0.040000, dx = 0.010000 -> h/dx = 4.0 (3D cost knob; 2D cases use 5).
# max_per_voxel 128 >= ceil(sqrt(2)*(h/dx)^3) = 91
# (V5 loader does not self-check; undersized cap = SILENT particle kills).
# derived: expected neighbors (4/3)pi(h/dx)^3 = 268.1; particles per voxel (h/dx)^3 = 64.0; dt = cfl*h/c0 = 6.000000e-05 s; total particles = 1,685,159
# max_per_voxel = ceil(1.3 * bound) rounded up to 32 (min 32); max_incoming = max_per_voxel/4 (min 8); eps_h^2 = 0.01 h^2, delta and PST coefficients unchanged (dimensionless).
time:
  total: null
  max_steps: null
  output_cadence: null

physics:
  dimension: 3
  h: 0.040000
  particle_radius: 0.005000
  lattice: grid
  calibrate_volume: true
  speed_of_sound: 100.0
  power: 7
  cfl: 0.15
  gravity: [0.0, 0.0, 0.0]

numerics:
  use_density_diffusion: true
  delta_coefficient: 0.1
  use_kcg_correction: true
  regularization:
    xi: 0.001
    det_threshold: 1.0e-4
    frobenius_max: 10.0
  # eps^2 = epsilon_squared_factor * h^2 (h = support radius) in the viscous / delta-diffusion
  # denominators; read by the V0 and v6 loaders (v2-v5 ignore it and use 0.01)
  epsilon_squared_factor: 0.0025
  use_pst: true
  pst_main: 0.1
  pst_anti: 0.0005
  defrag_enabled: true
  defrag_cadence: 1000
  defrag_order: prefix              # defrag pid order: prefix (voxel-id order, default since 2026-10-27) | atomic (arrival order)
  wall_boundary: crossing   # crossing-fraction walls (first order, axis-aligned box)
  volume_constraint:        # the fluid's total volume is held (closed container)
    enabled: true
  wall_crossing:
    continuity: extrapolate   # extrapolate | wall_velocity

capacities:
  pool_size: 1938048
  max_per_voxel: 128
  max_incoming: 32
  workgroup: 128

material_library: ../cavity3d_re1000_n100/materials.yaml

geometry:
  frame: ../cavity3d_re1000_n100/frame.obj
  particles:
    - {file: ../cavity3d_re1000_n100/domain.obj,   material: stick_water}
    - {file: ../cavity3d_re1000_n100/wall.obj,     material: stick_wall}
    - {file: ../cavity3d_re1000_n100/wall_top.obj, material: stick_lid}
