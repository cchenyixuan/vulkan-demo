schema_version: 2

# GENERATED by experiment/validation/micropolar_dipole.py cases: control_n500_zero_pressure
# Normal dipole-wall collision (Clercx & Bruneau 2006) in the box [-1, 1]^2 m, no-slip walls at rest
# (11 layers, adami); dx = 0.002000 m, h = 0.010000 m = 5 dx; fluid 1,000,000
# particles, walls 44,484.
# Thesis configuration of Chapter 5 (the cavity's numerics: laplacian, epsilon_squared_factor 1e-6, adami walls,
# KGC regularization 1e-3, density diffusion on every pair, particle shifting).
# Control: Newtonian fluid of viscosity nu_inf = 1.600000e-03 on the micropolar path, nu_t = -nu (c = 0 exactly), xi = 0, Theta = 4.000e-04 (passive w).
# Re = U W / nu_inf = 625 (U = 1 m/s rms velocity, W = 1 m). Speed of sound 600 m/s: Ma =
# 0.0184 on the largest initial speed (11.0190 m/s), 0.00167 on U.
# Time step: dt = min(CFL h / c0 = 2.5000e-06, s h^2 / nu = 2.0500e-03, s h^2 / (xi / Theta) =
# inf) with CFL = 0.15, s = 0.0328 / 0.0334: dt = 2.500000e-06 s,
# set by the acoustic limit. physics.cfl below is dt c0 / h = 0.15000000. End time 1 s =
# 400,000 steps.

time:
  total: null
  max_steps: null
  output_cadence: null

physics:
  dimension: 2
  h: 0.01000000
  particle_radius: 0.00100000
  lattice: grid
  calibrate_volume: true
  speed_of_sound: 600.000000
  power: 7
  cfl: 0.15000000
  gravity: [0.0, 0.0, 0.0]
  micropolar:
    enabled: true
    micro_inertia: 0.0004

numerics:
  use_density_diffusion: true
  delta_coefficient: 0.1
  use_kcg_correction: true
  regularization:
    xi: 0.001
    det_threshold: 1.0e-4
    frobenius_max: 10.0
  epsilon_squared_factor: 1.0e-6
  use_pst: true
  pst_main: 0.1
  pst_anti: 0.0005
  defrag_enabled: true
  defrag_cadence: 1000
  use_prefix_sum_defrag: false
  viscous_form: laplacian
  wall_boundary: adami

capacities:
  pool_size: 1201280
  max_per_voxel: 96
  max_incoming: 16
  workgroup: 128

material_library: materials.yaml

geometry:
  frame: ../geometry_n500/frame.obj
  particles:
    - {file: ../geometry_n500/domain.obj, material: dipole_fluid}
    - {file: ../geometry_n500/wall.obj,   material: dipole_wall}
