schema_version: 2

# 2D lid-driven cavity, aligned lattice: 128,142,400 fluid particles (128.14M).
# GENERATED by utils/geometry/_demo_cavity_case_aligned.py --dimension 2 --n 11320 --n-x 11320 --border 11
#   frame    = voxel-grid bounding box: column boundaries at the fluid edges x = -+0.500000 m,
#              2264 whole fluid columns + 3 wall columns on each side (2270 columns)
#   domain   = 11320 x 11320 = 128,142,400 fluid particles at the cell centres of the 1 m x 1 m cavity
#   wall     = 374,044 static U-shaped wall (bottom + two sides + top corners), 11 layers
#   wall_top = 124,520 lid particles (top, 11 layers); stick_lid has initial_velocity=[1,0,0]
# h = 0.00044169611307420494 m, dx = 8.833922261484099e-05 m -> h/dx = 5; total particles = 128,640,964

time:
  total: null
  max_steps: null
  output_cadence: null

physics:
  dimension: 2
  h: 0.00044169611307420494
  particle_radius: 4.416961130742049e-05
  lattice: grid
  calibrate_volume: true
  speed_of_sound: 100.0
  power: 7
  cfl: 0.15
  gravity: [0.0, 0.0, 0.0]

numerics:
  use_density_diffusion: true
  delta_coefficient: 0.1
  use_kcg_correction: true
  regularization:
    xi: 0.001
    det_threshold: 1.0e-4
    frobenius_max: 10.0
  # eps^2 = epsilon_squared_factor * h^2 (h = support radius) in the viscous / delta-diffusion
  # denominators; read by the V0 and v6 loaders (v2-v5 ignore it and use 0.01)
  epsilon_squared_factor: 0.0025
  use_pst: true
  pst_main: 0.1
  pst_anti: 0.0005
  defrag_enabled: true
  defrag_cadence: 1000
  use_prefix_sum_defrag: false

capacities:
  pool_size: 147937152
  max_per_voxel: 96
  max_incoming: 16
  workgroup: 128

material_library: ../../../materials/standard.yaml

geometry:
  frame: frame.obj
  particles:
    - {file: domain.obj,   material: stick_water}
    - {file: wall.obj,     material: stick_wall}
    - {file: wall_top.obj, material: stick_lid}
