schema_version: 2

# 2D lid-driven cavity, aligned lattice: 8,294,400 fluid particles (8.29M).
# GENERATED by utils/geometry/_demo_cavity_case_aligned.py --dimension 2 --n 1440 --n-x 5760 --border 11
#   frame    = voxel-grid bounding box: column boundaries at the fluid edges x = -+2.000000 m,
#              1152 whole fluid columns + 3 wall columns on each side (1158 columns)
#   domain   = 5760 x 1440 = 8,294,400 fluid particles at the cell centres of the 4 m x 1 m cavity
#   wall     = 95,524 static U-shaped wall (bottom + two sides + top corners), 11 layers
#   wall_top = 63,360 lid particles (top, 11 layers); stick_lid has initial_velocity=[1,0,0]
# h = 0.0034722222222222225 m, dx = 0.0006944444444444445 m -> h/dx = 5; total particles = 8,453,284

time:
  total: null
  max_steps: null
  output_cadence: null

physics:
  dimension: 2
  h: 0.0034722222222222225
  particle_radius: 0.00034722222222222224
  lattice: grid
  calibrate_volume: true
  speed_of_sound: 100.0
  power: 7
  cfl: 0.15
  gravity: [0.0, 0.0, 0.0]

numerics:
  use_density_diffusion: true
  delta_coefficient: 0.1
  use_kcg_correction: true
  regularization:
    xi: 0.001
    det_threshold: 1.0e-4
    frobenius_max: 10.0
  # eps^2 = epsilon_squared_factor * h^2 (h = support radius) in the viscous / delta-diffusion
  # denominators; read by the V0 and v6 loaders (v2-v5 ignore it and use 0.01)
  epsilon_squared_factor: 0.0025
  use_pst: true
  pst_main: 0.1
  pst_anti: 0.0005
  defrag_enabled: true
  defrag_cadence: 1000
  use_prefix_sum_defrag: false

capacities:
  pool_size: 9721344
  max_per_voxel: 96
  max_incoming: 16
  workgroup: 128

material_library: ../../../materials/standard.yaml

geometry:
  frame: frame.obj
  particles:
    - {file: domain.obj,   material: stick_water}
    - {file: wall.obj,     material: stick_wall}
    - {file: wall_top.obj, material: stick_lid}
