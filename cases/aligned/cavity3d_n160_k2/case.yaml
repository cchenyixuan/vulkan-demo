schema_version: 2

# 3D lid-driven cavity, aligned lattice: 8,192,000 fluid particles (8.19M).
# GENERATED by utils/geometry/_demo_cavity_case_aligned.py --dimension 3 --n 160 --n-x 320 --border 4
#   frame    = voxel-grid bounding box: column boundaries at the fluid edges x = -+1.000000 m,
#              80 whole fluid columns + 2 wall columns on each side (84 columns)
#   domain   = 320 x 160 x 160 = 8,192,000 fluid particles at the cell centres of the 2 m x 1 m x 1 m cavity
#   wall     = 860,672 static shell particles (4 layers, 5 faces + edges)
#   wall_top = 204,800 lid particles (band above the fluid footprint); stick_lid has initial_velocity=[1,0,0]
# h = 0.025 m, dx = 0.00625 m -> h/dx = 4; total particles = 9,257,472
# max_per_voxel 128 >= ceil(sqrt(2)*(h/dx)^3) = 91

time:
  total: null
  max_steps: null
  output_cadence: null

physics:
  dimension: 3
  h: 0.025
  particle_radius: 0.003125
  lattice: grid
  calibrate_volume: true
  speed_of_sound: 100.0
  power: 7
  cfl: 0.15
  gravity: [0.0, 0.0, 0.0]

numerics:
  use_density_diffusion: true
  delta_coefficient: 0.1
  use_kcg_correction: true
  regularization:
    xi: 0.001
    det_threshold: 1.0e-4
    frobenius_max: 10.0
  # eps^2 = epsilon_squared_factor * h^2 (h = support radius) in the viscous / delta-diffusion
  # denominators; read by the V0 and v6 loaders (v2-v5 ignore it and use 0.01)
  epsilon_squared_factor: 0.0025
  use_pst: true
  pst_main: 0.1
  pst_anti: 0.0005
  defrag_enabled: true
  defrag_cadence: 1000
  use_prefix_sum_defrag: false

capacities:
  pool_size: 10646144
  max_per_voxel: 128
  max_incoming: 32
  workgroup: 128

material_library: ../../../materials/standard.yaml

geometry:
  frame: frame.obj
  particles:
    - {file: domain.obj,   material: stick_water}
    - {file: wall.obj,     material: stick_wall}
    - {file: wall_top.obj, material: stick_lid}
