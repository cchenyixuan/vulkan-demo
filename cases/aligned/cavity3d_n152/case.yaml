schema_version: 2

# 3D lid-driven cavity, aligned lattice: 3,511,808 fluid particles (3.51M).
# GENERATED by utils/geometry/_demo_cavity_case_aligned.py --dimension 3 --n 152 --n-x 152 --border 4
#   frame    = voxel-grid bounding box: column boundaries at the fluid edges x = -+0.500000 m,
#              38 whole fluid columns + 2 wall columns on each side (42 columns)
#   domain   = 152 x 152 x 152 = 3,511,808 fluid particles at the cell centres of the 1 m x 1 m x 1 m cavity
#   wall     = 491,776 static shell particles (4 layers, 5 faces + edges)
#   wall_top = 92,416 lid particles (band above the fluid footprint); stick_lid has initial_velocity=[1,0,0]
# h = 0.02631578947368421 m, dx = 0.006578947368421052 m -> h/dx = 4; total particles = 4,096,000
# max_per_voxel 128 >= ceil(sqrt(2)*(h/dx)^3) = 91

time:
  total: null
  max_steps: null
  output_cadence: null

physics:
  dimension: 3
  h: 0.02631578947368421
  particle_radius: 0.003289473684210526
  lattice: grid
  calibrate_volume: true
  speed_of_sound: 100.0
  power: 7
  cfl: 0.15
  gravity: [0.0, 0.0, 0.0]

numerics:
  use_density_diffusion: true
  delta_coefficient: 0.1
  use_kcg_correction: true
  regularization:
    xi: 0.001
    det_threshold: 1.0e-4
    frobenius_max: 10.0
  # eps^2 = epsilon_squared_factor * h^2 (h = support radius) in the viscous / delta-diffusion
  # denominators; read by the V0 and v6 loaders (v2-v5 ignore it and use 0.01)
  epsilon_squared_factor: 0.0025
  use_pst: true
  pst_main: 0.1
  pst_anti: 0.0005
  defrag_enabled: true
  defrag_cadence: 1000
  use_prefix_sum_defrag: false

capacities:
  pool_size: 4710400
  max_per_voxel: 128
  max_incoming: 32
  workgroup: 128

material_library: ../../../materials/standard.yaml

geometry:
  frame: frame.obj
  particles:
    - {file: domain.obj,   material: stick_water}
    - {file: wall.obj,     material: stick_wall}
    - {file: wall_top.obj, material: stick_lid}
