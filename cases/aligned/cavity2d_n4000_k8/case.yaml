schema_version: 2

# 2D lid-driven cavity, aligned lattice: 128,000,000 fluid particles (128.00M).
# GENERATED by utils/geometry/_demo_cavity_case_aligned.py --dimension 2 --n 4000 --n-x 32000 --border 11
#   frame    = voxel-grid bounding box: column boundaries at the fluid edges x = -+4.000000 m,
#              6400 whole fluid columns + 3 wall columns on each side (6406 columns)
#   domain   = 32000 x 4000 = 128,000,000 fluid particles at the cell centres of the 8 m x 1 m cavity
#   wall     = 440,484 static U-shaped wall (bottom + two sides + top corners), 11 layers
#   wall_top = 352,000 lid particles (top, 11 layers); stick_lid has initial_velocity=[1,0,0]
# h = 0.00125 m, dx = 0.00025 m -> h/dx = 5; total particles = 128,792,484

time:
  total: null
  max_steps: null
  output_cadence: null

physics:
  dimension: 2
  h: 0.00125
  particle_radius: 0.000125
  lattice: grid
  calibrate_volume: true
  speed_of_sound: 100.0
  power: 7
  cfl: 0.15
  gravity: [0.0, 0.0, 0.0]

numerics:
  use_density_diffusion: true
  delta_coefficient: 0.1
  use_kcg_correction: true
  regularization:
    xi: 0.001
    det_threshold: 1.0e-4
    frobenius_max: 10.0
  # eps^2 = epsilon_squared_factor * h^2 (h = support radius) in the viscous / delta-diffusion
  # denominators; read by the V0 and v6 loaders (v2-v5 ignore it and use 0.01)
  epsilon_squared_factor: 0.0025
  use_pst: true
  pst_main: 0.1
  pst_anti: 0.0005
  defrag_enabled: true
  defrag_cadence: 1000
  use_prefix_sum_defrag: false

capacities:
  pool_size: 148111360
  max_per_voxel: 96
  max_incoming: 16
  workgroup: 128

material_library: ../../../materials/standard.yaml

geometry:
  frame: frame.obj
  particles:
    - {file: domain.obj,   material: stick_water}
    - {file: wall.obj,     material: stick_wall}
    - {file: wall_top.obj, material: stick_lid}
