schema_version: 2

# 3D cavity, aligned lattice: 7,077,888 fluid particles (7.08M) -- LID AT REST variant of cavity3d_n192 (local size-cost study,
# 2026-10-26): same particle files (referenced in ../cavity3d_n192), wall_top as a static wall (stick_wall) instead of the moving lid.
# GENERATED by utils/geometry/_demo_cavity_case_aligned.py --dimension 3 --n 192 --n-x 192 --border 4
#   frame    = voxel-grid bounding box: column boundaries at the fluid edges x = -+0.500000 m,
#              48 whole fluid columns + 2 wall columns on each side (52 columns)
#   domain   = 192 x 192 x 192 = 7,077,888 fluid particles at the cell centres of the 1 m x 1 m x 1 m cavity
#   wall     = 774,656 static shell particles (4 layers, 5 faces + edges)
#   wall_top = 147,456 lid particles (band above the fluid footprint); stick_lid has initial_velocity=[1,0,0]
# h = 0.020833333333333332 m, dx = 0.005208333333333333 m -> h/dx = 4; total particles = 8,000,000
# max_per_voxel 128 >= ceil(sqrt(2)*(h/dx)^3) = 91

time:
  total: null
  max_steps: null
  output_cadence: null

physics:
  dimension: 3
  h: 0.020833333333333332
  particle_radius: 0.0026041666666666665
  lattice: grid
  calibrate_volume: true
  speed_of_sound: 100.0
  power: 7
  cfl: 0.15
  gravity: [0.0, 0.0, 0.0]

numerics:
  use_density_diffusion: true
  delta_coefficient: 0.1
  use_kcg_correction: true
  regularization:
    xi: 0.001
    det_threshold: 1.0e-4
    frobenius_max: 10.0
  # eps^2 = epsilon_squared_factor * h^2 (h = support radius) in the viscous / delta-diffusion
  # denominators; read by the V0 and v6 loaders (v2-v5 ignore it and use 0.01)
  epsilon_squared_factor: 0.0025
  use_pst: true
  pst_main: 0.1
  pst_anti: 0.0005
  defrag_enabled: true
  defrag_cadence: 1000
  use_prefix_sum_defrag: false

capacities:
  pool_size: 9200000
  max_per_voxel: 128
  max_incoming: 32
  workgroup: 128

material_library: ../../../materials/standard.yaml

geometry:
  frame: ../cavity3d_n192/frame.obj
  particles:
    - {file: ../cavity3d_n192/domain.obj,   material: stick_water}
    - {file: ../cavity3d_n192/wall.obj,     material: stick_wall}
    - {file: ../cavity3d_n192/wall_top.obj, material: stick_wall}
