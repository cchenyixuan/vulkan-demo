# ============================================================================
# Schema version — bumped on ANY breaking change to this file's field set.
schema_version: 2

# VARIANT of cases/lid_driven_cavity_2d_4m for the cost table of Stage 3 (docs/micropolar_design.md): the thesis configuration (viscous_form laplacian, epsilon_squared_factor 1e-6, wall_boundary adami), micropolar terms on (materials/micropolar.yaml micropolar_water_re1000); the particle files are the base case's.

# ============================================================================
# 2D lid-driven cavity — V0 4M-particle benchmark.


time:
  total: null                 # no time budget — run until window closed
  max_steps: null
  output_cadence: null

physics:
  dimension: 2
  h: 0.0025                    # kernel SUPPORT radius (Wendland C4: W(r>=h)=0)
  particle_radius: 0.00025     # particle "radius"; diameter dx = 2·r
  lattice: grid
  calibrate_volume: true
  speed_of_sound: 100.0        # c0 ≈ 20·U_lid (Ma≈0.05) — soft EOS for stability
  power: 7                  # γ in Tait
  cfl: 0.15                 # dt = CFL·h/c0 = 3.75e-6 s
  gravity: [0.0, 0.0, 0.0]    # cavity has no body force
  micropolar:
    enabled: true
    micro_inertia: 1.6e-3   # Theta = l^2, l = 0.04 m

numerics:
  use_density_diffusion: true       # δ term in dρ/dt; false = vanilla WCSPH continuity
  delta_coefficient: 0.1

  use_kcg_correction: true         # false = identity M⁻¹ + zero ∇ρ (plain δ-SPH)
  regularization:
    xi: 0.001
    det_threshold: 1.0e-4
    frobenius_max: 10.0
  # eps^2 = epsilon_squared_factor * h^2 (h = support radius) in the viscous / delta-diffusion
  # denominators; read by the V0 and v6 loaders (v2-v5 ignore it and use 0.01)
  epsilon_squared_factor: 1.0e-6
  viscous_form: laplacian
  wall_boundary: adami

  use_pst: true                     # particle shifting (main + anti)
  pst_main: 0.1
  pst_anti: 0.0005

  defrag_enabled: true              # CPU-side: dispatch defrag at all?
  defrag_cadence: 1000              # steps between defrag dispatches (also runs once at boot)
  use_prefix_sum_defrag: false      # base-index strategy: false = atomicAdd, true = prefix sum (deterministic)

capacities:
  pool_size: 4800000
  max_per_voxel: 96
  max_incoming: 16
  workgroup: 128

material_library: ../../materials/micropolar.yaml

geometry:
  frame: ../lid_driven_cavity_2d_4m/frame.obj
  particles:
    - {file: ../lid_driven_cavity_2d_4m/domain.obj,   material: micropolar_water_re1000}
    - {file: ../lid_driven_cavity_2d_4m/wall.obj,     material: stick_wall}
    - {file: ../lid_driven_cavity_2d_4m/wall_top.obj, material: stick_lid}
