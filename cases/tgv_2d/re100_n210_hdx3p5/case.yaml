schema_version: 2

# 2-D Taylor-Green vortex, 210 x 210 = 44,100 fluid particles on [0, 1)^2, doubly periodic.
# GENERATED by experiment/v8/_make_tgv_case.py --side 210 --reynolds 100 --hdx 3.5
# dx = 0.0047619048, h = 0.016666667 (h/dx = 3.5), L/h = 60 voxels per side.
# U0 = 1, rho0 = 1, nu = 0.01 (Re = 100), c0 = 10 (Ma = 0.1),
# dt = CFL h / c0 = 0.00025; F(t) = exp(-0.78956835 t).

time:
  total: 2
  max_steps: null
  output_cadence: null

physics:
  dimension: 2
  periodic: [true, true]
  h: 0.016666667
  particle_radius: 0.0023809524
  lattice: grid
  calibrate_volume: true
  speed_of_sound: 10
  power: 7
  cfl: 0.15
