  use_pst: true
  pst_main: 0.1
  pst_anti: 0.0005
  defrag_enabled: true
  defrag_cadence: 1000
  use_prefix_sum_defrag: false

capacities:
  pool_size: 50816
  max_per_voxel: 64
  max_incoming: 16
  workgroup: 128

material_library: materials.yaml

geometry:
  frame: frame.obj
  particles:
    - {file: domain.obj, material: tgv_fluid}
