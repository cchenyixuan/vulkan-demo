schema_version: 2

# 2-D Taylor-Green vortex, 200 x 200 = 40,000 fluid particles on [0, 1)^2, doubly periodic.
# GENERATED by experiment/v8/_make_tgv_case.py --epsilon-squared-factor 0.0025 --side 200 --reynolds 100 --mach 0.02
# dx = 0.005, h = 0.025 (h/dx = 5), L/h = 40 voxels per side.
# U0 = 1, rho0 = 1, nu = 0.01 (Re = 100), c0 = 50 (Ma = 0.02),
# dt = CFL h / c0 = 7.5e-05; F(t) = exp(-0.78956835 t).

time:
  total: 2
  max_steps: null
  output_cadence: null

physics:
  dimension: 2
  periodic: [true, true]
  h: 0.025
  particle_radius: 0.0025
  lattice: grid
  calibrate_volume: true
  speed_of_sound: 50
  power: 7
  cfl: 0.15
  gravity: [0.0, 0.0, 0.0]

initial_field:
  type: taylor_green
  amplitude: 1
  vortex_pairs: 1
  origin_offset: [0.25, 0.25]
  density_from_pressure: true

numerics:
  use_density_diffusion: true
  delta_coefficient: 0.1
  use_kcg_correction: true
  regularization:
    xi: 0.001
    det_threshold: 1.0e-4
    frobenius_max: 10.0
  epsilon_squared_factor: 0.0025
  use_pst: true
  pst_main: 0.1
  pst_anti: 0.0005
  # v8 (case_loader_v8): store rho - rho0 on the GPU (the v7 kernels' DELTA_DENSITY) so the per-step density
  # increment keeps its float32 resolution at small dt
  delta_density: false
  defrag_enabled: true
  defrag_cadence: 1000
  use_prefix_sum_defrag: false

capacities:
  pool_size: 46080
  max_per_voxel: 64
  max_incoming: 16
  workgroup: 128

material_library: materials.yaml

geometry:
  frame: frame.obj
  particles:
    - {file: domain.obj, material: tgv_fluid}
