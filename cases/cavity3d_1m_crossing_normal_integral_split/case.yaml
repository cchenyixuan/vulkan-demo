# VARIANT of cases/cavity3d_1m_crossing/case.yaml (report section 24, 2026-11-20): numerics.wall_crossing.continuity_wall_component normal; numerics.volume_constraint.integral true; split_dispatch true, split_order near_wall_first; everything else identical.
schema_version: 2

# VARIANT of cases/cavity3d_1m: numerics.wall_boundary crossing; everything else identical; the particle OBJs are cavity3d_1m's (referenced, not copied).

# 3D lid-driven cavity — 1.03M-particle case.
# GENERATED by utils/geometry/_demo_cavity_case_3d.py:
#   frame    = bounding box of the 1 m^3 cavity + border shell
#   domain   = 1,030,301 fluid particles (simple-cubic lattice)
#   wall     = 563,049 static shell particles (9 layers, 5 faces + edges)
#   wall_top = 91,809 lid particles (band above the fluid footprint);
#              stick_lid has initial_velocity=[1,0,0]
# h = 0.040000, dx = 0.010000 -> h/dx = 4 (3D cost knob; 2D cases use 5).
# max_per_voxel 128 >= ceil(sqrt(2)*(h/dx)^3) = 91
# (V5 loader does not self-check; undersized cap = SILENT particle kills).

time:
  total: null
  max_steps: null
  output_cadence: null

physics:
  dimension: 3
  h: 0.040000
  particle_radius: 0.005000
  lattice: grid
  calibrate_volume: true
  speed_of_sound: 100.0
  power: 7
  cfl: 0.15
  gravity: [0.0, 0.0, 0.0]

numerics:
  use_density_diffusion: true
  delta_coefficient: 0.1
  use_kcg_correction: true
  regularization:
    xi: 0.001
    det_threshold: 1.0e-4
    frobenius_max: 10.0
  # eps^2 = epsilon_squared_factor * h^2 (h = support radius) in the viscous / delta-diffusion
  # denominators; read by the V0 and v6 loaders (v2-v5 ignore it and use 0.01)
  epsilon_squared_factor: 0.0025
  use_pst: true
  pst_main: 0.1
  pst_anti: 0.0005
  defrag_enabled: true
  defrag_cadence: 1000
  use_prefix_sum_defrag: false
  wall_boundary: crossing   # crossing-fraction walls (first order, axis-aligned box)
  volume_constraint:        # the fluid's total volume is held (closed container; since 2026-11-19)
    enabled: true
    integral: true            # report section 24 (integral_time default 4 x relaxation_time)
  wall_crossing:
    continuity: extrapolate   # extrapolate | wall_velocity
    split_dispatch: true      # report section 24
    split_order: near_wall_first
    continuity_wall_component: normal   # report section 24

capacities:
  pool_size: 1938048
  max_per_voxel: 128
  max_incoming: 32
  workgroup: 128

material_library: ../../materials/standard.yaml

geometry:
  frame: ../cavity3d_1m/frame.obj
  particles:
    - {file: ../cavity3d_1m/domain.obj,   material: stick_water}
    - {file: ../cavity3d_1m/wall.obj,     material: stick_wall}
    - {file: ../cavity3d_1m/wall_top.obj, material: stick_lid}
