# cavity3d_re1000_n70_hdx3p5_crossing (claude/wall_store_report.md section 14, experiment/wall_crossing/cavity3d_re1000_cases.py): N = 70, h/dx = 3.5, crossing walls, Re = 1000 on L = 1 + dx (materials.yaml of ../cavity3d_re1000_n70); the particles are ../cavity3d_re1000_n70's.
schema_version: 2

# 3D lid-driven cavity — 0.36M-particle case.
# GENERATED by utils/geometry/_demo_cavity_case_3d.py:
#   frame    = bounding box of the 1 m^3 cavity + border shell
#   domain   = 357,911 fluid particles (simple-cubic lattice)
#   wall     = 301,689 static shell particles (9 layers, 5 faces + edges)
#   wall_top = 45,369 lid particles (band above the fluid footprint);
#              stick_lid has initial_velocity=[1,0,0]
# h = 0.050000, dx = 0.014286 -> h/dx = 3.5 (3D cost knob; 2D cases use 5).
# max_per_voxel 96 >= ceil(sqrt(2)*(h/dx)^3) = 61
# (V5 loader does not self-check; undersized cap = SILENT particle kills).
# derived: expected neighbors (4/3)pi(h/dx)^3 = 179.6; particles per voxel (h/dx)^3 = 42.9; dt = cfl*h/c0 = 7.500000e-05 s; total particles = 704,969
# max_per_voxel = ceil(1.3 * bound) rounded up to 32 (min 32); max_incoming = max_per_voxel/4 (min 8); eps_h^2 = 0.01 h^2, delta and PST coefficients unchanged (dimensionless).
time:
  total: null
  max_steps: null
  output_cadence: null

physics:
  dimension: 3
  h: 0.050000
  particle_radius: 0.007143
  lattice: grid
  calibrate_volume: true
  speed_of_sound: 100.0
  power: 7
  cfl: 0.15
  gravity: [0.0, 0.0, 0.0]

numerics:
  use_density_diffusion: true
  delta_coefficient: 0.1
  use_kcg_correction: true
  regularization:
    xi: 0.001
    det_threshold: 1.0e-4
    frobenius_max: 10.0
  # eps^2 = epsilon_squared_factor * h^2 (h = support radius) in the viscous / delta-diffusion
  # denominators; read by the V0 and v6 loaders (v2-v5 ignore it and use 0.01)
  epsilon_squared_factor: 0.0025
  use_pst: true
  pst_main: 0.1
  pst_anti: 0.0005
  defrag_enabled: true
  defrag_cadence: 1000
  defrag_order: prefix              # defrag pid order: prefix (voxel-id order, default since 2026-10-27) | atomic (arrival order)
  wall_boundary: crossing   # crossing-fraction walls (first order, axis-aligned box)
  volume_constraint:        # the fluid's total volume is held (closed container)
    enabled: true
  wall_crossing:
    continuity: extrapolate   # extrapolate | wall_velocity

capacities:
  pool_size: 810752
  max_per_voxel: 96
  max_incoming: 24
  workgroup: 128

material_library: ../cavity3d_re1000_n70/materials.yaml

geometry:
  frame: ../cavity3d_re1000_n70/frame.obj
  particles:
    - {file: ../cavity3d_re1000_n70/domain.obj,   material: stick_water}
    - {file: ../cavity3d_re1000_n70/wall.obj,     material: stick_wall}
    - {file: ../cavity3d_re1000_n70/wall_top.obj, material: stick_lid}
