schema_version: 2

# GENERATED by experiment/validation/micropolar_couette.py generate: step_probe_micropolar
# Annulus between a rotating inner cylinder (R1 = 0.400000 m = 200 dx, centre x =
# 0.000000 m, Omega = 2.500000 rad/s, wall speed 1.000000 m/s) and a fixed outer cylinder
# (R2 = 0.500000 m = 250 dx); dx = 0.002000 m, h = 0.010000 m, lattice
# offset (0, 0) dx, lattice angle 0 deg.
#   fluid 70,664 particles, inner wall 13,436, outer wall 17,668 (11 dx thick shells)
# Thesis configuration: viscous_form laplacian, epsilon_squared_factor 1e-6, wall_boundary adami.
# Micropolar: K = kappa / mu = 3, m = g / (2 l) = 2.5 (l = 10 dx); nu = 1.600000e-02, nu_t = -4.000000e-03, c = 1.200000e-02, xi = 6.000000e-06, Theta = 4.000000e-04; rotor micro-rotation = 1 Omega.
# Time step: dt = min(CFL h / c0 = 3.0000e-05, s h^2 / nu = 6.2500e-03, s h^2 / (xi / Theta) =
# 6.6667e-03) with CFL = 0.15, s = 1: dt = 3.000000e-05 s, set by the acoustic limit.
# The solver computes dt = cfl h / c0, so physics.cfl below is the effective number dt c0 / h = 0.150000.
# End time 2.000000 s = 67,000 steps.

time:
  total: null
  max_steps: null
  output_cadence: null

physics:
  dimension: 2
  h: 0.01000000
  particle_radius: 0.00100000
  lattice: grid
  calibrate_volume: true
  speed_of_sound: 50.000000
  power: 7
  cfl: 0.15000000
  gravity: [0.0, 0.0, 0.0]
  micropolar:
    enabled: true
    micro_inertia: 0.0004

numerics:
  use_density_diffusion: true
  delta_coefficient: 0.1
  use_kcg_correction: true
  regularization:
    xi: 0.001
    det_threshold: 1.0e-4
    frobenius_max: 10.0
  epsilon_squared_factor: 1.0e-6
  use_pst: true
  pst_main: 0.1
  pst_anti: 0.0005
  defrag_enabled: true
  defrag_cadence: 1000
  viscous_form: laplacian
  wall_boundary: adami

capacities:
  pool_size: 131306
  max_per_voxel: 96
  max_incoming: 16
  workgroup: 128

material_library: materials.yaml

geometry:
  frame: frame.obj
  particles:
    - {file: domain.obj,     material: couette_fluid}
    - {file: wall_inner.obj, material: couette_rotor}
    - {file: wall_outer.obj, material: couette_stator}
