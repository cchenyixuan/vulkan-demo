schema_version: 2

# VARIANT of cases/lid_driven_cavity_2d_gen for the cost table of Stage 3 (docs/micropolar_design.md): the thesis configuration (viscous_form laplacian, epsilon_squared_factor 1e-6, wall_boundary adami), micropolar terms on (materials/micropolar.yaml micropolar_water_re1000); the particle files are the base case's.

# 2D lid-driven cavity — 1.0M-particle case.
# GENERATED by utils/geometry/_demo_cavity_case.py — same 4-part split as
# cases/lid_driven_cavity_2d:
#   frame    = bounding box of the 1.0 m x 1.0 m cavity
#   domain   = 1,002,001 fluid particles filling the cavity interior
#   wall     = 33,517 static U-shaped wall (bottom + two sides + top corners), 11 layers
#   wall_top = 11,011 lid particles (top, 11 layers); stick_lid has initial_velocity=[1,0,0]
# h = 0.005000, dx = 0.001000 -> h/dx = 5.

time:
  total: null
  max_steps: null
  output_cadence: null

physics:
  dimension: 2
  h: 0.005000
  particle_radius: 0.000500
  lattice: grid
  calibrate_volume: true
  speed_of_sound: 100.0
  power: 7
  cfl: 0.15
  gravity: [0.0, 0.0, 0.0]
  micropolar:
    enabled: true
    micro_inertia: 1.6e-3   # Theta = l^2, l = 0.04 m

numerics:
  use_density_diffusion: true
  delta_coefficient: 0.1
  use_kcg_correction: true
  regularization:
    xi: 0.001
    det_threshold: 1.0e-4
    frobenius_max: 10.0
  # eps^2 = epsilon_squared_factor * h^2 (h = support radius) in the viscous / delta-diffusion
  # denominators; read by the V0 and v6 loaders (v2-v5 ignore it and use 0.01)
  epsilon_squared_factor: 1.0e-6
  viscous_form: laplacian
  wall_boundary: adami
  use_pst: true
  pst_main: 0.1
  pst_anti: 0.0005
  defrag_enabled: true
  defrag_cadence: 1000
  use_prefix_sum_defrag: false

capacities:
  pool_size: 1203584
  max_per_voxel: 96
  max_incoming: 16
  workgroup: 128

material_library: ../../materials/micropolar.yaml

geometry:
  frame: ../lid_driven_cavity_2d_gen/frame.obj
  particles:
    - {file: ../lid_driven_cavity_2d_gen/domain.obj,   material: micropolar_water_re1000}
    - {file: ../lid_driven_cavity_2d_gen/wall.obj,     material: stick_wall}
    - {file: ../lid_driven_cavity_2d_gen/wall_top.obj, material: stick_lid}
