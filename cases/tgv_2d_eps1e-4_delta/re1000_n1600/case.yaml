schema_version: 2

# 2-D Taylor-Green vortex, 1600 x 1600 = 2,560,000 fluid particles on [0, 1)^2, doubly periodic.
# GENERATED by experiment/v8/_make_tgv_case.py --side 1600 --reynolds 1000 --delta-density
# dx = 0.000625, h = 0.003125 (h/dx = 5), L/h = 320 voxels per side.
# U0 = 1, rho0 = 1, nu = 0.001 (Re = 1000), c0 = 10 (Ma = 0.1),
# dt = CFL h / c0 = 4.6875e-05; F(t) = exp(-0.078956835 t).

time:
  total: 2
  max_steps: null
  output_cadence: null

physics:
  dimension: 2
  periodic: [true, true]
  h: 0.003125
  particle_radius: 0.0003125
  lattice: grid
  calibrate_volume: true
  speed_of_sound: 10
  power: 7
  cfl: 0.15
  gravity: [0.0, 0.0, 0.0]

initial_field:
  type: taylor_green
  amplitude: 1
  vortex_pairs: 1
  origin_offset: [0.25, 0.25]
  density_from_pressure: true

numerics:
  use_density_diffusion: true
  delta_coefficient: 0.1
  use_kcg_correction: true
  regularization:
    xi: 0.001
    det_threshold: 1.0e-4
    frobenius_max: 10.0
  epsilon_squared_factor: 0.0001
  use_pst: true
  pst_main: 0.1
  pst_anti: 0.0005
  # v8 (case_loader_v8): store rho - rho0 on the GPU (the v7 kernels' DELTA_DENSITY) so the per-step density
  # increment keeps its float32 resolution at small dt
  delta_density: true
  defrag_enabled: true
  defrag_cadence: 1000
  use_prefix_sum_defrag: false

capacities:
  pool_size: 2944000
  max_per_voxel: 64
  max_incoming: 16
  workgroup: 128

material_library: materials.yaml

geometry:
  frame: frame.obj
  particles:
    - {file: domain.obj, material: tgv_fluid}
